name: Publish catalog

# After a merge to main: validate everything again, zip the packages, write index.json on the
# `dist` branch and sign it with MODS_SIGNING_KEY. Atelier reads
# https://raw.githubusercontent.com/kaizensx/atelier-mods/dist/index.json (and index.json.sig).
#
# Published files on `dist` are never rewritten: a version, once out, keeps its bytes and its
# checksum, so its download link in the version history keeps working.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build, sign and publish index.json
    runs-on: ubuntu-latest
    # Holds the MODS_SIGNING_KEY secret. Restrict it to the main branch in Settings > Environments.
    environment: catalog-signing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check out the dist branch
        run: |
          if git fetch origin dist 2>/dev/null; then
            git worktree add -B dist out FETCH_HEAD
          else
            git worktree add --orphan -b dist out
          fi

      - name: Build the index
        run: node scripts/build-index.mjs --out out

      - name: Sign the index
        env:
          MODS_SIGNING_KEY: ${{ secrets.MODS_SIGNING_KEY }}
        run: |
          node scripts/sign-index.mjs out/index.json
          node scripts/sign-index.mjs --verify out/index.json

      - name: Push to dist
        working-directory: out
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish catalog from ${GITHUB_SHA::7}"
          git push origin HEAD:dist
